<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function calculate(a, b)
        {
            console.log(`Введено: a = ${a}, b = ${b}`);
            let promise = new Promise((resolve, reject) => {
                setTimeout(() => {
                    if(b === 0)
                        reject(new Error("Ділення на нуль заборонено"));
                    else
                        resolve(a / b);
                });
            });
            return promise;
        }

        calculate(10, 2).then(result => {
            console.log("Результат ділення", result)
        })
        .catch(error => {
            console.log("Помилка", error)
        });

        calculate(10, 0).then(result => {
            console.log("Результат ділення", result)
        })
        .catch(error => {
            console.log("Помилка", error)
        });

    </script>
</body>
</html>
