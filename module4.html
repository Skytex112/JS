<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>JS Завдання</title>
  <style>
    /* Завдання 2 */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: #fff;
      padding: 20px;
      border-radius: 5px;
    }

    /* Завдання 3 */
    #field {
      width: 100vw;
      height: 100vh;
      background: green;
      position: relative;
      overflow: hidden;
    }
    #ball {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: white;
      border: 5px solid black;
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      transition: top 0.5s, left 0.5s;
    }

    /* Завдання 4*/
    #trafficLight {
      width: 100px;
      background: black;
      padding: 10px;
      border-radius: 10px;
    }
    .light {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      margin: 10px auto;
      background: grey;
    }
  </style>
</head>
<body>
  <h2>Завдання 1: Введення імені без цифр</h2>
  <input type="text" id="username" placeholder="Введіть ім'я">

  <h2>Завдання 2: Модальне вікно</h2>
  <button id="openBtn">Відкрити</button>
  <div class="modal" id="myModal">
    <div class="modal-content">
      <p>Це модальне вікно</p>
      <button id="closeBtn">Закрити</button>
    </div>
  </div>

  <h2>Завдання 3: Футбольне поле</h2>
  <div id="field">
    <div id="ball"></div>
  </div>

  <h2>Завдання 4: Світлофор</h2>
  <div id="trafficLight">
    <div id="red" class="light"></div>
    <div id="yellow" class="light"></div>
    <div id="green" class="light"></div>
  </div>
  <button id="switchBtn">Перемкнути</button>

  <script>
    //Завдання 1
    const usernameInput = document.getElementById("username");
    usernameInput.addEventListener("input", function() {
      this.value = this.value.replace(/[0-9]/g, "");
    });

    //Завдання 2
    const modal = document.getElementById("myModal");
    document.getElementById("openBtn").onclick = () => modal.style.display = "flex";
    document.getElementById("closeBtn").onclick = () => modal.style.display = "none";

    // Завдання 3
    const field = document.getElementById("field");
    const ball = document.getElementById("ball");
    field.addEventListener("click", function(e) {
      const rect = field.getBoundingClientRect();
      let x = e.clientX - rect.left;
      let y = e.clientY - rect.top;

      x -= ball.offsetWidth / 2;
      y -= ball.offsetHeight / 2;

      if (x < 0) x = 0;
      if (y < 0) y = 0;
      if (x > rect.width - ball.offsetWidth) x = rect.width - ball.offsetWidth;
      if (y > rect.height - ball.offsetHeight) y = rect.height - ball.offsetHeight;

      ball.style.left = x + "px";
      ball.style.top = y + "px";
    });

    //Завдання 4
    const lights = [document.getElementById("red"), document.getElementById("yellow"), document.getElementById("green")];
    let current = 0;
    function updateLights() {
      lights.forEach(light => light.style.background = "grey");
      lights[current].style.background = ["red","yellow","green"][current];
    }
    updateLights();
    document.getElementById("switchBtn").onclick = () => {
      current = (current + 1) % 3;
      updateLights();
    };
  </script>
</body>
</html>
