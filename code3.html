<!doctype html>
<html lang="uk">

<head>
  <meta charset="utf-8">
  <title>Каталог копірайтерів</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      background: #f4f4f9;
    }

    header {
      background: #333;
      color: #fff;
      padding: 10px;
    }

    main {
      display: flex;
    }

    #userList {
      width: 200px;
      border-right: 1px solid #ccc;
      padding: 10px;
    }

    .user {
      cursor: pointer;
      padding: 5px;
    }

    .user:hover {
      background: #ddd;
    }

    #details {
      flex: 1;
      padding: 10px;
    }

    .post {
      border: 1px solid #ccc;
      margin: 5px 0;
      padding: 5px;
    }
  </style>
</head>

<body>
  <header>
    <h1>Каталог копірайтерів</h1>
  </header>
  <main>
    <div id="userList">Завантаження...</div>
    <div id="details">Оберіть користувача</div>
  </main>

  <script>
    const userList = document.getElementById('userList');
    const details = document.getElementById('details');

    fetch('https://jsonplaceholder.typicode.com/users')
      .then(res => res.json())
      .then(users => {
        userList.innerHTML = '';
        users.forEach(u => {
          const div = document.createElement('div');
          div.className = 'user';
          div.textContent = u.name;
          div.onclick = () => showUser(u);
          userList.appendChild(div);
        });
      });

    function showUser(user) {
      details.innerHTML = `
        <h2>${user.name}</h2>
        <p><strong>Username:</strong> ${user.username}</p>
        <p><strong>Email:</strong> ${user.email}</p>
        <p><strong>Телефон:</strong> ${user.phone}</p>
        <p><strong>Адреса:</strong> ${user.address.street}, ${user.address.suite}, ${user.address.city}, ${user.address.zipcode}</p>
        <p><strong>Вебсайт:</strong> <a href="http://${user.website}" target="_blank">${user.website}</a></p>
        <button onclick="showPosts(${user.id})">Показати пости</button>
        <div id="posts"></div>
      `;
    }

    function showPosts(userId) {
      const postsDiv = document.getElementById('posts');
      postsDiv.textContent = 'Завантаження...';
      fetch('https://jsonplaceholder.typicode.com/posts?userId=' + userId)
        .then(res => res.json())
        .then(posts => {
          postsDiv.innerHTML = posts.map(p =>
            `<div class="post"><strong>${p.title}</strong><p>${p.body}</p></div>`
          ).join('');
        });
    }
  </script>
</body>

</html>
