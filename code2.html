<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        function onSuccess(result) {
            console.log("Результат:", result);
        }

        function onError(error) {
            console.error("Помилка:", error);
        }

        async function calculate(a, b, onSuccess, onError) {
            return new Promise((resolve, reject) => {
                setTimeout(() => {
                    if (b === 0) {
                        reject(new Error("Ділення на нуль заборонено"));
                    } else {
                        resolve(a / b);
                    }
                }, 100);
            });

        }
        async function main()
        {
            let num = await calculate(10, 2, onSuccess, onError);
            console.log(num);
            let num2 = await calculate(10, 0, onSuccess, onError);
            console.log(num2);
  
        }
        main();
    </script>
</body>

</html>
